sensors:
  # Model VLP16
  lidar3d:
    - model: velodyne_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.12, 0.0, 0.1603]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        velodyne_driver_node:
          frame_id: lidar3d_0_laser
          device_ip: 192.168.131.20
          port: 2368
          model: VLP16
        velodyne_transform_node:
          model: VLP16
          fixed_frame: lidar3d_0_laser
          target_frame: lidar3d_0_laser


  imu:
    - model: redshift_um7
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [-0.12, 0.0, 0.005]
      rpy: [3.14159, 0., -1.570796]
      ros_parameters:
        um7_driver:
          port: /dev/ttyUSB0
          frame_id: imu_0_link
          tf_ned_to_enu: true


  camera:
#  - model: flir_blackfly
#    urdf_enabled: true
#    launch_enabled: true
#    parent: base_link
#    xyz: [0.0, 0.0, 0.0]
#    rpy: [0.0, 0.0, 0.0]
#    ros_parameters:
#      flir_blackfly:
#        serial_number: '18505176'
#        gain_auto: Continuous
#        pixel_format: BayerRG8
        # Resolution
        # image_width: 1408
        # image_height: 1080
        # offset_x: 0
        # offset_y: 0
#        binning_x: 2
#        binning_y: 2
#        frame_rate_enable: true
#        frame_rate_auto: Off
#        frame_rate: 30
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "825312072012"
          enable_color: true
          rgb_camera.color_profile: 640,480,30
          enable_depth: false
          #depth_module.depth_profile: 640,480,15
          pointcloud.enable: false
