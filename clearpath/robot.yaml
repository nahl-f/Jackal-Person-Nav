serial_number: j100-0304
version: 0
system:
  hosts:
    - hostname: jackal1
      ip: 192.168.131.1
  ros2:
    namespace: jackal1
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
      discovery: server
#      servers: # This section is described further below
#      - hostname: jackal1

platform:
  attachments:
    - name: front_fender
      type: j100.fender
    - name: rear_fender
      type: j100.fender
      rpy: [0.0, 0.0, 3.1415]
  controller: ps4 # one of ps4, ps4, logitech, xbox
  extras:
    ros_parameters:
      twist_mux:
#        topics:
#          - name: joy_teleop
#            topic: joy_teleop/cmd_vel
#            timeout: 0.5
#            priority: 10
#          - name: autonomous
#            topic: cmd_vel
#            timeout: 0.5
#            priority: 5
         locks:
           joy_stop.topic: platform/joy_stop
           joy_stop.timeout: 0.0
           joy_stop.priority: 254
#
